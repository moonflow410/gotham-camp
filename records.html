<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고담시의 선택 · 활동 기록 모아보기</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23F59E0B'/%3E%3Cpath d='M4 19v-6h2V11h1.5v2H9V7h2v12h1V9.5l1.5-1.5L15 9.5V19h1v-5h3v5z' fill='%230F172A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .rec h4 { font-size: .8rem; font-weight: 800; color: var(--gold-ink); margin: 14px 0 4px; letter-spacing: .02em; }
    .rec p, .rec li { font-size: .92rem; white-space: pre-wrap; }
    .rec .empty { color: var(--muted); font-style: italic; }
    .rec .self { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    @media print {
      .topbar, #toolbar, .no-print { display: none !important; }
      body { background: #fff; }
      .card { box-shadow: none; break-inside: avoid; page-break-inside: avoid; margin-bottom: 12px; }
      .rec-grid { display: block !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="signal" id="logo"></div>
      <div class="min-w-0 flex-1">
        <div class="brand text-lg leading-tight">학생별 활동 기록 모아보기</div>
        <div class="text-xs text-indigo-200">교사용 · 학교생활기록부 작성 참고</div>
      </div>
      <span id="demoBadge" class="badge badge-gold hidden">데모 모드</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-5" id="app">
    <section class="card max-w-md mx-auto mt-10" id="gate">
      <h2>교사 확인</h2>
      <p class="muted text-sm mt-1">학생 개인 기록이 담긴 페이지예요. Settings 시트의 adminPin 을 입력하세요.</p>
      <input id="pinIn" type="password" inputmode="numeric" class="input mt-3" placeholder="PIN">
      <button class="btn btn-gold btn-block mt-3" id="pinOk">열기</button>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/records.js"></script>
</body>
</html>
